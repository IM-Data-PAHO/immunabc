authors:
   Pan American Health Organization:
     html: "<img src='https://github.com/IM-Data-PAHO/immunabc/blob/main/man/figures/pahobrand-blue-stacked-2024-en.png?raw=true' height='100' alt='PAHO'/>"
     href: "https://www.paho.org/en"

reference:
  - title: Date Consistency Comparison
    desc: Functions for identifying and visualizing date inconsistencies in the EIR.
    contents:
      - dcc_rate
      - dcc_barplot
      - dcc_inconsistent
      - dcc_inconsistent_plot

  - title: Dose Sequence Comparison
    desc: Functions for identifying and visualizing incomplete and chronologically inconsistent dose sequences in the EIR.
    contents:
      - sc_rate
      - sc_barplot
      - sc_inconsistent
      - sc_inconsistent_plot
      - sc_date_sequence

  - title: Vaccination Timeliness
    desc: Functions for calculating and visualizing vaccination timeliness in the EIR.
    contents:
      - vt_rate
      - vt_barplot
      - vt_inconsistent
      - vt_inconsistent_plot
      - vt_distribution
      - vt_cdf_plot
      - vt_pdf_plot
      - vt_percentile
      - vt_percentile_plot

  - title: Nominal Dropout Rate
    desc: Functions for calculating and visualizing nominal dropout rate.
    contents:
      - nod_dropout
      - nod_barplot

  - title: Residence vs. Ocurrence Analyses
    desc: Functions for calculating and visualizing coverage and dose distribution by place of residence or vaccination.
    contents:
      - roc_coverage
      - roc_barplot
      - roc_distribution
      - roc_heatmap
      - roc_coverage_by
      - bc_coverage
      - bc_barplot

  - title: Complete Schedule Coverage
    desc: Functions for calculating and visualizing complete schedule coverage.
    contents:
      - cs_coverage
      - cs_barplot
      - cs_upsetplot

  - title: Birth Cohort Coverage
    desc: Functions for calculating and visualizing birth cohort coverage.
    contents:
      - bc_coverage
      - bc_barplot

  - title: Example Data
    desc: Example data frames to understand how the package works and what it expects.
    contents:
      - immunABC.EIR
      - immunABC.pop.ADM0
      - immunABC.pop.ADM1
      - immunABC.pop.ADM2
      - immunABC.schedule
