<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: #ffffff; color-scheme: light;" version="1.1" width="1081px" height="561px" viewBox="-0.5 -0.5 1081 561">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 3 5 z" fill="#000000"/>
    </marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14px" text-anchor="middle" fill="#000000">

    <!-- EIR -->
    <rect x="0" y="250" width="120" height="60" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="60" y="280" dy="0.35em">EIR</text>

    <!-- branches from EIR -->
    <path d="M 120 280 L 180 280" fill="none" stroke="#000000"/>
    <path d="M 180 130 L 180 430" fill="none" stroke="#000000"/>
    <path d="M 180 130 L 238 130" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <path d="M 180 330 L 238 330" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <path d="M 180 430 L 238 430" fill="none" stroke="#000000" marker-end="url(#arrow)"/>

    <!-- row 1: dd_rate -->
    <rect x="240" y="100" width="240" height="60" rx="9" fill="#fff2cc" stroke="#d6b656"/>
    <text x="360" y="130" dy="0.35em">dd_rate()</text>
    <path d="M 480 130 L 558 130" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="560" y="100" width="80" height="60" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="600" y="130" dy="0.35em">Table</text>

    <!-- row 1: analyze -->
    <path d="M 600 100 L 600 62" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="560" y="0" width="80" height="60" rx="9" fill="#d5e8d4" stroke="#82b366"/>
    <text x="600" y="30" dy="0.35em">Analyze</text>

    <!-- branches from dd_rate table -->
    <path d="M 640 130 L 680 130" fill="none" stroke="#000000"/>
    <path d="M 680 130 L 680 230" fill="none" stroke="#000000"/>
    <path d="M 680 130 L 718 130" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <path d="M 680 230 L 718 230" fill="none" stroke="#000000" marker-end="url(#arrow)"/>

    <!-- row 1: dd_barplot -->
    <rect x="720" y="100" width="240" height="60" rx="9" fill="#fff2cc" stroke="#d6b656"/>
    <text x="840" y="130" dy="0.35em">dd_barplot()</text>
    <path d="M 960 130 L 998 130" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="1000" y="100" width="80" height="60" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="1040" y="130" dy="0.35em">Plot</text>

    <!-- row 2: dd_heatmap -->
    <rect x="720" y="200" width="240" height="60" rx="9" fill="#fff2cc" stroke="#d6b656"/>
    <text x="840" y="230" dy="0.35em">dd_heatmap()</text>
    <path d="M 960 230 L 998 230" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="1000" y="200" width="80" height="60" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="1040" y="230" dy="0.35em">Plot</text>

    <!-- row 3: dd_trend -->
    <rect x="240" y="300" width="240" height="60" rx="9" fill="#fff2cc" stroke="#d6b656"/>
    <text x="360" y="330" dy="0.35em">dd_trend()</text>
    <path d="M 480 330 L 558 330" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="560" y="300" width="80" height="60" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="600" y="330" dy="0.35em">Table</text>
    <path d="M 640 330 L 718 330" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="720" y="300" width="240" height="60" rx="9" fill="#fff2cc" stroke="#d6b656"/>
    <text x="840" y="330" dy="0.35em">dd_trend_plot()</text>
    <path d="M 960 330 L 998 330" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="1000" y="300" width="80" height="60" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="1040" y="330" dy="0.35em">Plot</text>

    <!-- row 4: dd_duplicates -->
    <rect x="240" y="400" width="240" height="60" rx="9" fill="#fff2cc" stroke="#d6b656"/>
    <text x="360" y="430" dy="0.35em">dd_duplicates()</text>
    <path d="M 480 430 L 558 430" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="560" y="400" width="80" height="60" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="600" y="430" dy="0.35em">Table</text>
    <path d="M 640 430 L 718 430" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="720" y="400" width="240" height="60" rx="9" fill="#fff2cc" stroke="#d6b656"/>
    <text x="840" y="430" dy="0.35em">dd_repeat_plot()</text>
    <path d="M 960 430 L 998 430" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="1000" y="400" width="80" height="60" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="1040" y="430" dy="0.35em">Plot</text>

    <!-- row 4: analyze -->
    <path d="M 600 460 L 600 498" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="560" y="500" width="80" height="60" rx="9" fill="#d5e8d4" stroke="#82b366"/>
    <text x="600" y="530" dy="0.35em">Analyze</text>

  </g>
</svg>
