<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: #ffffff; color-scheme: light;" version="1.1" width="1081px" height="381px" viewBox="-0.5 -0.5 1081 381">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 3 5 z" fill="#000000"/>
    </marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14px" text-anchor="middle" fill="#000000">

    <!-- EIR -->
    <rect x="0" y="160" width="120" height="60" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="60" y="190" dy="0.35em">EIR</text>

    <!-- branches from EIR -->
    <path d="M 120 190 L 180 190" fill="none" stroke="#000000"/>
    <path d="M 180 50 L 180 330" fill="none" stroke="#000000"/>
    <path d="M 180 50 L 238 50" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <path d="M 180 190 L 238 190" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <path d="M 180 330 L 238 330" fill="none" stroke="#000000" marker-end="url(#arrow)"/>

    <!-- row 1: sc_rate -->
    <rect x="240" y="20" width="240" height="60" rx="9" fill="#fff2cc" stroke="#d6b656"/>
    <text x="360" y="50" dy="0.35em">sc_rate()</text>
    <path d="M 480 50 L 558 50" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="560" y="20" width="80" height="60" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="600" y="50" dy="0.35em">Table</text>
    <path d="M 640 50 L 718 50" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="720" y="20" width="240" height="60" rx="9" fill="#fff2cc" stroke="#d6b656"/>
    <text x="840" y="50" dy="0.35em">sc_barplot()</text>
    <path d="M 960 50 L 998 50" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="1000" y="20" width="80" height="60" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="1040" y="50" dy="0.35em">Plot</text>

    <!-- row 2: sc_inconsistent -->
    <rect x="240" y="160" width="240" height="60" rx="9" fill="#fff2cc" stroke="#d6b656"/>
    <text x="360" y="190" dy="0.35em">sc_inconsistent()</text>
    <path d="M 480 190 L 558 190" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="560" y="160" width="80" height="60" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="600" y="190" dy="0.35em">Table</text>
    <path d="M 640 190 L 718 190" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="720" y="160" width="240" height="60" rx="9" fill="#fff2cc" stroke="#d6b656"/>
    <text x="840" y="190" dy="0.35em">sc_inconsistent_plot()</text>
    <path d="M 960 190 L 998 190" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="1000" y="160" width="80" height="60" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="1040" y="190" dy="0.35em">Plot</text>

    <!-- row 3: sc_date_sequence -->
    <rect x="240" y="300" width="240" height="60" rx="9" fill="#fff2cc" stroke="#d6b656"/>
    <text x="360" y="330" dy="0.35em">sc_date_sequence()</text>
    <path d="M 480 330 L 558 330" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="560" y="300" width="80" height="60" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="600" y="330" dy="0.35em">Table</text>
    <path d="M 640 330 L 718 330" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="720" y="300" width="240" height="60" rx="9" fill="#fff2cc" stroke="#d6b656"/>
    <text x="840" y="330" dy="0.35em">sc_barplot()</text>
    <path d="M 960 330 L 998 330" fill="none" stroke="#000000" marker-end="url(#arrow)"/>
    <rect x="1000" y="300" width="80" height="60" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="1040" y="330" dy="0.35em">Plot</text>

  </g>
</svg>
